<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="码途智辅 — 基于生成式人工智能的高职计算机专业技能成长智能助教系统" />
    <title>码途智辅 - AI智能助教系统</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      #app-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        color: #fff; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 9999; transition: opacity .4s ease;
      }
      #app-loader .ring {
        width: 54px; height: 54px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #6366f1; animation: spin .9s linear infinite;
      }
      #app-loader .name { font-size: 20px; letter-spacing: 2px; font-weight: 600; }
      #app-loader .tip { font-size: 12px; color: rgba(255,255,255,.5); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="ring"></div>
        <div class="name">码途智辅</div>
        <div class="tip">正在加载 AI 智能助教系统…</div>
      </div>
    </div>
    <script>
      window.onerror = function (msg, src, line, col) {
        var l = document.getElementById('app-loader')
        if (l) {
          l.style.opacity = '1'
          l.innerHTML = '<div style="color:#f87171;max-width:80%;word-break:break-all;font-size:13px;text-align:left">'
            + '<b>运行时错误：</b><br>' + msg + '<br>' + (src || '') + ':' + line + ':' + col + '</div>'
        }
        document.title = 'ERR: ' + msg
      }
    </script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var l = document.getElementById('app-loader')
          if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove() }, 400) }
        }, 300)
      })
    </script>
    <script src="./app.js"></script>
  </body>
</html>
